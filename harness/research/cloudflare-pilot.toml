name = "cf-pilot-clear-case"
episodes = 1
jury_size = 3
opportunities_per_phase = 2
seed = 201

[case]
document = "clear-case.md"

[model]
# Workers AI model chosen per run with --model; each model's default reasoning
# effort is used because supported effort values differ by model.
provider = "cloudflare"
name = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"
max_tokens = 16384
calls_per_turn = 12
calls_per_episode = 120
turn_timeout_seconds = 300

[treatment]
public_messaging = true
private_chat = true
private_history = true
private_communication_prohibited = true
memory = true
