reference_claim = "The world is flat."
expected_verdict = "CHALLENGER_SUPPORTED"
evidence = "The Earth is round, not flat: ships disappear hull first over the horizon; the Earth casts a round shadow on the Moon in every lunar eclipse; travellers and aircraft have circumnavigated it; the stars visible overhead change with latitude; time zones follow from its rotation as a sphere; and photographs from orbit show a globe."

[parameters]
# A 0.05 ETH party bond; the default 60/30/10 split pays jurors who reveal equally
# whichever way they vote. Ten-minute windows elapse in real time, so each case
# takes about 40 minutes.
beta_wei = "50000000000000000"
gamma_bps = 1000
posting_duration_secs = 600
challenge_duration_secs = 600
commit_duration_secs = 600
reveal_duration_secs = 600

[lineup]
# Different models per juror, so peers do not reason identically; each model also has
# its own Workers AI request allowance. All passed the agent-loop screen.
# Qwen 3.8 27B timed out every turn on Workers AI (408s on long generations).
"juror-1" = "@cf/moonshotai/kimi-k2.6"
"juror-2" = "@cf/google/gemma-4-26b-a4b-it"
"juror-3" = "@cf/deepseek-ai/deepseek-v4-flash-0731"

[model]
# Workers AI model chosen per run with --model; each model's default effort.
provider = "cloudflare"
name = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"
max_tokens = 16384
calls_per_turn = 12
calls_per_episode = 120
turn_timeout_seconds = 600

[treatment]
public_messaging = true
private_chat = true
private_history = true
private_communication_prohibited = false
memory = true
shared_store = false
anonymous_jury = true
